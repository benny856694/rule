# 必读！！！
# 此配置不防DNS泄露，想使用防泄漏专业版本请使用同目录下另一个名字为mihomo的版本

# 节点信息
proxies:
  - { name: 直连, type: direct }
  - name: "office"
    type: ss
    server: 127.0.0.1
    port: 20000
    cipher: aes-128-gcm
    password: "" #fill password here
    udp: true
# 全局配置
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

external-controller: 0.0.0.0:9090
secret: ""
external-ui: ui
external-ui-url: "https://gh-proxy.com/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# 入站
tun:
  enable: true
  stack: mixed ##如果内核版本大于v1.19.31，此处可以改为自研协议栈 mips ，理论上性能更好。
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS模块
dns:
  enable: true
  cache-algorithm: arc
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*"
    - "+.lan"
    - "+.local"
    - "+.market.xiaomi.com"
    - "guzzoni.apple.com"
    - "+.guzzoni.apple.com"
    - "+.siri.apple.com"
    - "dejavu.apple.com"
    - "sequoia.apple.com"
    - "+.smoot.apple.com"
    - "+.push.apple.com"
    - "gspe1-ssl.ls.apple.com"
    - "+.issuer.apple.com"
    - "+.ropes.apple.com"
    - "mask-api.icloud.com"
    - "mask.icloud.com"
    - "mask-h2.icloud.com"
    - "+.app.apple.com"
    - "+.apple-relay.apple.com"
    - "+.apple-relay.cloudflare.com"
    - "+.apple-relay.fastly-edge.com"
    - "+.apple-relay.akamaized.net"
  default-nameserver:
    - 223.5.5.5
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

# 出站策略，根据自己情况调整每个策略里分组排序，增删都可以，比如把美国自动放到第一个，比如删除香港故转，注意别漏掉表情逗号等。
# 如果相应分组没有筛选到对应的国家，请根据自己节点名字调整筛选关键字。
# 没有再使用锚点和icon图标，是考虑很多新手修改难度，这样新手修改某个分组更容易些。
proxy-groups:
  - { name: 🚀 默认代理, type: select, proxies: ["office"] }
  - { name: 📹 YouTube, type: select, proxies: ["office"] }
  - { name: 🍀 Google, type: select, proxies: ["office"] }
  - { name: 🤖 AI, type: select, proxies: ["office"] }
  - { name: 👨🏿‍💻 GitHub, type: select, proxies: ["office"] }
  - { name: 🐬 OneDrive, type: select, proxies: ["office"] }
  - { name: 🪟 Microsoft, type: select, proxies: ["office"] }
  - { name: 🎵 TikTok, type: select, proxies: ["office"] }
  - { name: 📲 Telegram, type: select, proxies: ["office"] }
  - { name: 🎥 NETFLIX, type: select, proxies: ["office"] }
  - { name: 💶 Wallet, type: select, proxies: ["office"] }
  - { name: 🎮 Steam, type: select, proxies: ["office"] }
  - { name: 🍎 Apple, type: select, proxies: ["office"] }
  - { name: 🐟 漏网之鱼, type: select, proxies: ["office"] }
  - { name: 🇭🇰 香港节点, type: select, proxies: ["office"] }
  - { name: 🇯🇵 日本节点, type: select, proxies: ["office"] }
  - { name: 🇸🇬 狮城节点, type: select, proxies: ["office"] }
  - { name: 🇺🇲 美国节点, type: select, proxies: ["office"] }
  - { name: 🔯 香港故转, type: fallback, proxies: ["office"] }
  - { name: 🔯 日本故转, type: fallback, proxies: ["office"] }
  - { name: 🔯 狮城故转, type: fallback, proxies: ["office"] }
  - { name: 🔯 美国故转, type: fallback, proxies: ["office"] }
  - {
      name: ♻️ 香港自动,
      type: url-test,
      tolerance: 20,
      interval: 300,
      proxies: ["office"],
    }
  - {
      name: ♻️ 日本自动,
      type: url-test,
      tolerance: 20,
      interval: 300,
      proxies: ["office"],
    }
  - {
      name: ♻️ 狮城自动,
      type: url-test,
      tolerance: 20,
      interval: 300,
      proxies: ["office"],
    }
  - {
      name: ♻️ 美国自动,
      type: url-test,
      tolerance: 20,
      interval: 300,
      proxies: ["office"],
    }
  - {
      name: ♻️ 自动选择,
      include-all: true,
      type: url-test,
      tolerance: 20,
      interval: 300,
      proxies: ["office"],
    }
  - { name: 🌐 全部节点, type: select, include-all: true }

